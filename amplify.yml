version: 1
frontend:
   phases:
       preBuild:
           commands:
               - npm install
       build:
           commands:
               - env | grep -E '^(DYNAMO_DB_URL|REQUEST_URL|PROJECT_S3_BUCKET_URL|GALLERY_AWS_REGION|GALLERY_BUCKET|GALLERY_BUCKET_URL|GALLERY_ACCESS_KEY|GALLERY_ACCESS_KEY_ID|DYNAMO_DB_TABLE|BLOG_API_GATEWAY|GOOGLE_CALENDAR_URL|GOOGLE_CALENDAR_API_KEY)=' > .env.production
               - npm run build
   artifacts:
       baseDirectory: .next
       files:
           - '**/*'
   cache:
       paths:
           - 'node_modules/**/*'
